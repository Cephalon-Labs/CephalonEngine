apiVersion: apps/v1
kind: Deployment
metadata:
  name: cephalon-template-app
  labels:
    app.kubernetes.io/name: cephalon-template-app
    app.kubernetes.io/part-of: cephalon
    app.kubernetes.io/component: host
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cephalon-template-app
      app.kubernetes.io/component: host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cephalon-template-app
        app.kubernetes.io/part-of: cephalon
        app.kubernetes.io/component: host
    spec:
      containers:
      - name: cephalon-template-app
        image: replace-with-registry/cephalon-template-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: DOTNET_ENVIRONMENT
          value: Production
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
