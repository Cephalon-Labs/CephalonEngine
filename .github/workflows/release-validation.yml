name: Release Validation

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            validate_args: ""
            benchmark_artifact_suffix: windows
          - os: ubuntu-latest
            validate_args: "-SkipBenchmarks"
            benchmark_artifact_suffix: linux

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PowerShell Pester suites
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/Cephalon.Tests.Scripts'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'artifacts/pester-results/cephalon-scripts-tests.xml'
          New-Item -Path 'artifacts/pester-results' -ItemType Directory -Force | Out-Null
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failure(s); aborting validation."
          }

      - name: Run release validation
        shell: pwsh
        run: ./scripts/validate-release.ps1 ${{ matrix.validate_args }}

      - name: Record SRE CI flake-rate evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/measure-ci-flake-rate.ps1 -Repository ${{ github.repository }} -AllowUnavailable

      - name: Upload benchmark results
        if: always() && matrix.validate_args == ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.benchmark_artifact_suffix }}
          path: BenchmarkDotNet.Artifacts/results
          if-no-files-found: warn

      - name: Upload reference docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-docs-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/reference-docs-release
          if-no-files-found: warn

      - name: Upload .NET readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-readiness-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/dotnet-readiness-release
          if-no-files-found: warn

      - name: Upload deployment-mode claim validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-mode-claims-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/deployment-mode-claims-release
          if-no-files-found: warn

      - name: Upload surface maturity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-maturity-report-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/surface-maturity-report-release
          if-no-files-found: error

      - name: Upload engine completion scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-completion-scorecard-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/engine-completion-scorecard-release
          if-no-files-found: warn

      - name: Upload NuGet vulnerability audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerability-audit-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/nuget-vulnerability-audit-release
          if-no-files-found: warn

      - name: Upload Pester test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/pester-results
          if-no-files-found: warn

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/packages-release
          if-no-files-found: warn

      - name: Upload public-API delta summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-delta-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/public-api-delta-release
          if-no-files-found: warn

      - name: Upload SRE CI flake-rate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-ci-flake-rate-${{ matrix.benchmark_artifact_suffix }}
          path: artifacts/sre-ci-flake-rate
          if-no-files-found: warn

  dotnet11-readiness:
    name: .NET 11 Readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run .NET 11 readiness validation
        shell: pwsh
        run: ./scripts/validate-dotnet-readiness.ps1 -Configuration Release -OutputPath artifacts/dotnet-readiness-sdk11 -SkipReferenceDocs -SkipPackages

      - name: Upload .NET 11 readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-readiness-sdk11
          path: artifacts/dotnet-readiness-sdk11
          if-no-files-found: warn
