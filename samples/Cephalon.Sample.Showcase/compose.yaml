##
## Cephalon.Sample.Showcase — Docker Compose infrastructure
##
## Provides the external services needed to exercise every transport and data provider
## in the showcase sample. Start with:
##
##   docker compose -f samples/Cephalon.Sample.Showcase/compose.yaml up -d
##
## All services expose their standard ports on localhost for local development.
##

## docker compose -f compose.yaml up -d

services:
  # === PostgreSQL 17 — EF data store, event store, outbox, inbox ===
  postgres:
    image: postgres:17-alpine
    container_name: showcase-postgres
    environment:
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase_secret
      POSTGRES_DB: showcase_write
    ports:
      - "5432:5432"
    volumes:
      - showcase-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === MongoDB 8 — Document store for catalog ===
  mongodb:
    image: mongo:8
    container_name: showcase-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: showcase
      MONGO_INITDB_ROOT_PASSWORD: showcase_secret
      MONGO_INITDB_DATABASE: showcase_db
    ports:
      - "27017:27017"
    volumes:
      - showcase-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === Redis 8 — Session cache, cart state cache ===
  redis:
    image: redis:8-alpine
    container_name: showcase-redis
    ports:
      - "6379:6379"
    volumes:
      - showcase-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === RabbitMQ 4 — Saga + event-driven messaging transport ===
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: showcase-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: showcase
      RABBITMQ_DEFAULT_PASS: showcase_secret
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - showcase-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Kafka (KRaft mode, no ZooKeeper) — Process-manager + event-driven transport ===
  kafka:
    image: apache/kafka:3.9.0
    container_name: showcase-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: showcase-kafka-cluster-001
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # === OpenTelemetry Collector — Observability ===
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: showcase-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"     # gRPC OTLP
      - "4318:4318"     # HTTP OTLP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

volumes:
  showcase-postgres-data:
  showcase-mongodb-data:
  showcase-redis-data:
  showcase-rabbitmq-data:
